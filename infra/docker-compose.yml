services:
  # ── OpenMRS 3 ────────────────────────────────────────────────────────────────
  openmrs-backend:
    image: openmrs/openmrs-reference-application-3-backend:nightly
    depends_on:
      openmrs-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES_AT_STARTUP: "true"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      JAVA_OPTS: "-Xms512m -Xmx1536m"
    volumes:
      - openmrs-data:/openmrs/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/openmrs/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s

  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:nightly
    depends_on:
      - openmrs-backend
    ports:
      - "8081:80"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: http://openmrs-backend:8080
      SPA_CONFIG_URLS: ""

  openmrs-db:
    image: mysql:8.0
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --log_bin_trust_function_creators=1"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD:-openmrs_root}
    volumes:
      - openmrs-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${OPENMRS_DB_ROOT_PASSWORD:-openmrs_root}"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ── Application Database (app + Langfuse share, separate schemas) ─────────────
  app-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-community_health}
      POSTGRES_USER: ${APP_DB_USER:-app}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-app_secret}
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-app} -d ${APP_DB_NAME:-community_health}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Langfuse (self-hosted v2) ─────────────────────────────────────────────────
  langfuse:
    image: langfuse/langfuse:2
    depends_on:
      app-db:
        condition: service_healthy
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://${APP_DB_USER:-app}:${APP_DB_PASSWORD:-app_secret}@app-db:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-changeme_langfuse_nextauth_32chars}
      SALT: ${LANGFUSE_SALT:-changeme_langfuse_salt_32chars__}
      NEXTAUTH_URL: http://localhost:3100
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  # ── Grafana ───────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    depends_on:
      - prometheus
    ports:
      - "3200:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana

  # ── Backend (phase 2+) ────────────────────────────────────────────────────────
  # backend:
  #   build: ../backend
  #   ports:
  #     - "8000:8000"
  #   env_file: ../.env
  #   depends_on:
  #     app-db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  # ── Frontend (phase 4+) ───────────────────────────────────────────────────────
  # frontend:
  #   build: ../frontend
  #   ports:
  #     - "3000:3000"
  #   env_file: ../.env

volumes:
  openmrs-data:
  openmrs-mysql-data:
  app-db-data:
  redis-data:
  prometheus-data:
  grafana-data:
