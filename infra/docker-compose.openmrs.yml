# Standalone OpenMRS stack — bring up once, leave running.
# Use when iterating on backend/frontend to avoid restarting the heavy OpenMRS container.
#
# Usage:
#   docker compose -f infra/docker-compose.openmrs.yml up -d
#   docker compose -f infra/docker-compose.openmrs.yml down

services:
  openmrs-backend:
    image: openmrs/openmrs-reference-application-3-backend:nightly
    depends_on:
      openmrs-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES_AT_STARTUP: "true"
      OMRS_CONFIG_CONNECTION_SERVER: openmrs-db
      OMRS_CONFIG_CONNECTION_DATABASE: openmrs
      OMRS_CONFIG_CONNECTION_USERNAME: ${OPENMRS_DB_USER:-openmrs}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
    volumes:
      - openmrs-data:/openmrs/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/openmrs/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 180s

  openmrs-frontend:
    image: openmrs/openmrs-reference-application-3-frontend:nightly
    depends_on:
      - openmrs-backend
    ports:
      - "8081:80"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: http://openmrs-backend:8080
      SPA_CONFIG_URLS: ""

  openmrs-db:
    image: mysql:8.0
    command: "--character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --log_bin_trust_function_creators=1"
    environment:
      MYSQL_DATABASE: openmrs
      MYSQL_USER: ${OPENMRS_DB_USER:-openmrs}
      MYSQL_PASSWORD: ${OPENMRS_DB_PASSWORD:-openmrs}
      MYSQL_ROOT_PASSWORD: ${OPENMRS_DB_ROOT_PASSWORD:-openmrs_root}
    volumes:
      - openmrs-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--password=${OPENMRS_DB_ROOT_PASSWORD:-openmrs_root}"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  openmrs-data:
  openmrs-mysql-data:
